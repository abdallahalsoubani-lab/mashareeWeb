version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: masharee-postgres
    restart: always
    environment:
      POSTGRES_USER: masharee_user
      POSTGRES_PASSWORD: masharee_password_secure_2026
      POSTGRES_DB: masharee_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - masharee-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masharee_user -d masharee_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masharee-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    networks:
      - masharee-network
    volumes:
      - app_data:/app/data

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: masharee-nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - masharee-network

volumes:
  postgres_data:
    driver: local
  app_data:
    driver: local

networks:
  masharee-network:
    driver: bridge
